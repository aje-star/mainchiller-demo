name: Deploy MainChiller demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reconstruct uploaded project directories
        run: |
          mkdir -p src public/data
          for file in App.tsx App.css index.css main.tsx SensorExplorer.tsx RuleComparison.tsx ModelComparison.tsx; do
            cp "$file" "src/$file"
          done
          for file in 15_SENSOR_COMPARISON.csv 16_RULE_COMPARISON.csv 21_MODEL_COMPARISON.csv; do
            cp "$file" "public/data/$file"
          done
          for file in favicon.svg hero.png icons.svg react.svg vite.svg; do
            if [ -f "$file" ]; then cp "$file" "public/$file"; fi
          done
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
